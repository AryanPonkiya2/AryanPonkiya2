<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="40%" stop-color="#0E172A"/>
      <stop offset="75%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#064E68"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>

    <!-- Subtle Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6B11FF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0099FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38EF7D" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }
    .wave1 { animation: waveMove1 12s ease-in-out infinite; }
    .wave2 { animation: waveMove2 9s ease-in-out infinite; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #A0AEC0;
    }
  </style>

  <!-- Background Base with rounded corners -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Tech Grid Points / Lines -->
  <g opacity="0.12" stroke="#00F2FE" stroke-width="0.7">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#00F2FE" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="180" r="160" fill="#38EF7D" opacity="0.06" filter="url(#glow)"/>

  <!-- Fluid Waves in Background -->
  <path class="wave1" d="M-100,240 C200,190 450,290 750,230 C1000,180 1200,260 1350,220 L1350,340 L-100,340 Z" fill="url(#waveGrad1)"/>
  <path class="wave2" d="M-50,260 C250,220 500,280 800,240 C1050,200 1250,270 1400,250 L1400,340 L-50,340 Z" fill="url(#waveGrad2)"/>

  <!-- Top Badge / Terminal Tag -->
  <g transform="translate(600, 52)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#0E172A" stroke="#00F2FE" stroke-width="1.2" opacity="0.9"/>
    <circle cx="-110" cy="0" r="4" fill="#38EF7D"/>
    <text text-anchor="middle" y="5" class="tag-text" fill="#00F2FE" font-size="12">PORTFOLIO &amp; REPOSITORIES</text>
  </g>

  <!-- Main Hero Headline -->
  <text text-anchor="middle" x="600" y="145" class="title-text" font-size="52" fill="url(#textGrad)" filter="url(#glow)">ARYAN PONKIYA</text>
  <text text-anchor="middle" x="600" y="145" class="title-text" font-size="52" fill="url(#textGrad)">ARYAN PONKIYA</text>

  <!-- Subtitle -->
  <text text-anchor="middle" x="600" y="195" class="sub-text" font-size="18" fill="#E2E8F0">
    AI DEVELOPER • MACHINE LEARNING • DEEP LEARNING • GENERATIVE AI
  </text>

  <!-- Pill Tags Row -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Python -->
    <g transform="translate(-300, 0)">
      <rect x="-48" y="-13" width="96" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text text-anchor="middle" y="4" class="tag-text" fill="#38BDF8">🐍 Python</text>
    </g>
    <!-- Pill 2: Machine Learning -->
    <g transform="translate(-160, 0)">
      <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text text-anchor="middle" y="4" class="tag-text" fill="#34D399">🧠 Machine Learning</text>
    </g>
    <!-- Pill 3: Deep Learning -->
    <g transform="translate(10, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text text-anchor="middle" y="4" class="tag-text" fill="#F59E0B">⚡ Deep Learning</text>
    </g>
    <!-- Pill 4: Generative AI -->
    <g transform="translate(170, 0)">
      <rect x="-68" y="-13" width="136" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text text-anchor="middle" y="4" class="tag-text" fill="#A78BFA">✨ Generative AI</text>
    </g>
    <!-- Pill 5: Computer Vision -->
    <g transform="translate(325, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text text-anchor="middle" y="4" class="tag-text" fill="#F472B6">👁️ Computer Vision</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
