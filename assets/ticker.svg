<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 46" width="100%" height="46">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Left & Right Edge Fade Gradients -->
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="1"/>
    </linearGradient>

    <!-- Clip Path for the full sliding area -->
    <clipPath id="tickerClip">
      <rect x="8" y="4" width="984" height="38" rx="6"/>
    </clipPath>
  </defs>

  <style>
    @keyframes slideLoop {
      0% {
        transform: translateX(0px);
      }
      100% {
        transform: translateX(-750px);
      }
    }
    .sliding-track {
      animation: slideLoop 12s linear infinite;
    }
    .ticker-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #E2E8F0;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Outer Container -->
  <rect x="1" y="1" width="998" height="44" rx="8" fill="url(#tickerBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Full-Width Scrolling Marquee Text -->
  <g clip-path="url(#tickerClip)">
    <g class="sliding-track">
      <!-- Segment 1 -->
      <text x="0" y="28" class="ticker-text" textLength="750" lengthAdjust="spacing">
        <tspan fill="#00F2FE">✦</tspan> AI Developer <tspan fill="#475569">|</tspan> Python <tspan fill="#475569">|</tspan> Machine Learning <tspan fill="#475569">|</tspan> Deep Learning <tspan fill="#475569">|</tspan> Generative AI &#160;&#160;&#160;
      </text>
      <!-- Segment 2 -->
      <text x="750" y="28" class="ticker-text" textLength="750" lengthAdjust="spacing">
        <tspan fill="#00F2FE">✦</tspan> AI Developer <tspan fill="#475569">|</tspan> Python <tspan fill="#475569">|</tspan> Machine Learning <tspan fill="#475569">|</tspan> Deep Learning <tspan fill="#475569">|</tspan> Generative AI &#160;&#160;&#160;
      </text>
      <!-- Segment 3 -->
      <text x="1500" y="28" class="ticker-text" textLength="750" lengthAdjust="spacing">
        <tspan fill="#00F2FE">✦</tspan> AI Developer <tspan fill="#475569">|</tspan> Python <tspan fill="#475569">|</tspan> Machine Learning <tspan fill="#475569">|</tspan> Deep Learning <tspan fill="#475569">|</tspan> Generative AI &#160;&#160;&#160;
      </text>
    </g>
  </g>

  <!-- Left & Right Smooth Fade Overlays -->
  <rect x="2" y="2" width="36" height="42" rx="6" fill="url(#fadeLeft)" pointer-events="none"/>
  <rect x="962" y="2" width="36" height="42" rx="6" fill="url(#fadeRight)" pointer-events="none"/>
</svg>
